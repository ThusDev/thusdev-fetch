name: Bug report
description: Report a reproducible problem in ThusDev Fetch
title: "bug: "
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.x
    validations:
      required: true
